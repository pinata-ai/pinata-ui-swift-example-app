name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Build the app
        run: |
          cp Config.example.xcconfig Config.xcconfig
          brew install xcodegen
          xcodegen generate
          xcodebuild build -project PinataUIExampleApp.xcodeproj -scheme PinataUIExampleApp -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
